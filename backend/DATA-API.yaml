- id: staff-login
  description: Вход тестового сотрудника
  mandatory: true
  method: POST
  path: /staff/auth/login
  parameters:
    path: {}
    query: {}
    headers:
      Origin: ${SITE_ORIGIN}
      Content-Type: application/json
