- id: issues-list
  description: Список обращений дома
  mandatory: true
  method: GET
  path: /houses/{house_id}/issues
  parameters:
    path:
      house_id: ${HOUSE_ID}
    query:
      cursor: 0
      limit: 20
    headers:
      Authorization: Bearer ${MAX_INIT_DATA}
    body: null
  role: resident
  expected:
    status_codes:
    - 200
    content_type: application/json
    json_schema:
      properties:
        items:
          items:
            properties:
              id:
                type: integer
                title: Id
              house_id:
                type: integer
                title: House Id
              title:
                type: string
                title: Title
              description:
                type: string
                title: Description
              category:
                type: string
                enum:
                - water
                - heating
                - electricity
                - elevator
                - entrance
                - yard
                - garbage
                - security
                - other
                title: IssueCategory
              status:
                type: string
                enum:
                - new
                - in_progress
                - resolved
                title: IssueStatus
              priority:
                type: integer
                title: Priority
              created_at:
                type: string
                format: date-time
                title: Created At
              mine:
                type: boolean
                title: Mine
              address:
                type: string
                title: Address
              place:
                anyOf:
                - properties:
                    entrance:
                      type: integer
                      maximum: 100.0
                      minimum: 1.0
                      title: Entrance
                    floor:
                      type: integer
                      maximum: 200.0
                      minimum: 1.0
                      title: Floor
                    zone:
                      type: string
                      enum:
                      - apartment
                      - corridor
                      - stairs
                      - elevator
                      - technical
                      - entrance
                      - house
                      - courtyard
                      - parking
                      title: Zone
                    apartment_id:
                      anyOf:
                      - type: integer
                        exclusiveMinimum: 0.0
                      - type: 'null'
                      title: Apartment Id
                  additionalProperties: false
                  type: object
                  required:
                  - entrance
                  - floor
                  - zone
                  title: Location
                - type: 'null'
              history:
                items:
                  properties:
                    status:
                      type: string
                      enum:
                      - new
                      - in_progress
                      - resolved
                      title: IssueStatus
                    at:
                      type: string
                      format: date-time
                      title: At
                  type: object
                  required:
                  - status
                  - at
                  title: IssueHistory
                type: array
                title: History
              photo_ids:
                items:
                  type: integer
                type: array
                title: Photo Ids
            type: object
            required:
            - id
            - house_id
            - title
            - description
            - category
            - status
            - priority
            - created_at
            - mine
            - address
            - place
            - history
            title: IssueResponse
          type: array
          title: Items
        next_cursor:
          anyOf:
          - type: integer
          - type: 'null'
          title: Next Cursor
      type: object
      required:
      - items
      - next_cursor
      title: IssuePage
