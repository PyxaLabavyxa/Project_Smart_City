schema_version: '1.0'
schema_file: DATA-API.schema.json
solution: Домовед
team: Облачный Код
updated_at: '2026-09-30'
base_url: https://201.34.159.33/api/v1
local_base_url: http://127.0.0.1:8000/api/v1
openapi: evaluation/openapi.yaml
openapi_json: evaluation/openapi.json
test_data: test-data.json
test_accounts: test-accounts.example.json
execution:
  order: В порядке checks; capture сохраняет указанное поле JSON-ответа в переменную
  parameters: 'Подстановка ${NAME} сохраняет исходный тип значения: ID передаются
    числами, токены строками'
  writes: Проверки POST изменяют только выделенные тестовые данные; учётные записи
    должны иметь общую привязку к тестовому дому
  version_note: Версия собственного формата команды, определённого DATA-API.schema.json;
    отдельная схема организаторов не предоставлена
  cookies: HTTP-клиент сохраняет и отправляет cookie из Set-Cookie между запросами;
    cookie сотрудника выдаётся staff-login
documentation:
  swagger: https://201.34.159.33/api/docs
  redoc: https://201.34.159.33/api/redoc
  openapi: https://201.34.159.33/api/openapi.json
authentication:
  resident:
    scheme: MAXLaunchData
    type: http
    header: 'Authorization: Bearer ${MAX_INIT_DATA}'
  staff:
    type: cookie
    name: dompulse_staff
    login_path: /staff/auth/login
    csrf_header: 'X-CSRF-Token: ${STAFF_CSRF_TOKEN}'
    csrf_source: staff-profile.csrf_token
variables:
  SITE_ORIGIN: https://201.34.159.33
  HOUSE_ID: Числовой ID выделенного тестового дома
  COMPANY_ID: Числовой ID УК тестового дома
  APARTMENT_ID: Числовой ID квартиры тестового жителя
  RECIPIENT_APARTMENT_ID: Числовой ID другой тестовой квартиры в том же доме
  METER_ID: Числовой ID счётчика тестового жителя
  READING_PERIOD: Текущий открытый период тестового лицевого счёта
  MAX_INIT_DATA: Свежая initData тестового жителя из MAX
  STAFF_LOGIN: Логин тестового сотрудника, передаваемый отдельно
  STAFF_PASSWORD: Пароль тестового сотрудника, передаваемый отдельно
  ISSUE_ID: Результат issue-create.id
  ISSUE_REQUEST_ID: Новый UUID для каждого независимого прогона; при повторе того
    же запроса сохраняется
  STATUS_REQUEST_ID: Новый UUID для каждого независимого прогона; при повторе того
    же запроса сохраняется
  STAFF_MESSAGE_REQUEST_ID: Новый UUID для каждого независимого прогона; при повторе
    того же запроса сохраняется
  MESSAGE_REQUEST_ID: Новый UUID для каждого независимого прогона; при повторе того
    же запроса сохраняется
  STAFF_CSRF_TOKEN: Результат staff-profile.csrf_token
service_checks:
- id: service-live
  method: GET
  url: https://201.34.159.33/health/live
  role: anonymous
  expected:
