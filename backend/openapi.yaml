components:
  schemas:
    AccountResponse:
      properties:
        number:
          type: string
          title: Number
        invoiceNumber:
          anyOf:
          - type: string
          - type: 'null'
          title: Invoicenumber
        area:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Area
        residents:
          type: integer
          title: Residents
        period:
          anyOf:
          - type: string
          - type: 'null'
          title: Period
        readingPeriod:
          type: string
          title: Readingperiod
        due:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Due
        charges:
          items:
            $ref: '#/components/schemas/Charge'
          type: array
          title: Charges
        meters:
          items:
            $ref: '#/components/schemas/MeterResponse'
          type: array
          title: Meters
      type: object
      required:
      - number
      - invoiceNumber
      - area
      - residents
      - period
      - readingPeriod
      - due
      - charges
      - meters
      title: AccountResponse
