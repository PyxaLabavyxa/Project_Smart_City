openapi: 3.1.0
info:
  title: Домовед API
  version: 0.1.0
paths:
  /health/live:
    get:
      tags:
      - Service health
      summary: Liveness
      operationId: liveness_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/ready:
    get:
      tags:
      - Service health
      summary: Readiness
      operationId: readiness_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: DB unavailable
  /api/v1/auth/max:
    post:
      tags:
      - auth
      summary: Login
      operationId: login_api_v1_auth_max_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LaunchInput'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/local:
    post:
      tags:
      - auth
      summary: Local Login
      operationId: local_login_api_v1_auth_local_post
      responses:
        '204':
          description: Successful Response
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: Logout
      operationId: logout_api_v1_auth_logout_post
      responses:
        '204':
          description: Successful Response
  /api/v1/auth/presence:
    post:
      tags:
      - auth
      summary: Presence
      operationId: presence_api_v1_auth_presence_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresenceInput'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - MAXLaunchData: []
  /api/v1/houses/{house_id}/contacts:
    get:
      tags:
      - resident
      summary: Contacts
      operationId: contacts_api_v1_houses__house_id__contacts_get
      security:
      - MAXLaunchData: []
      parameters:
      - name: house_id
        in: path
        required: true
        schema:
          type: integer
          title: House Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactsOutput'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/me/notifications:
    get:
      tags:
      - resident
      summary: Notification Preferences
      operationId: notification_preferences_api_v1_me_notifications_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
      security:
      - MAXLaunchData: []
    post:
      tags:
      - resident
      summary: Save Notification Preferences
      operationId: save_notification_preferences_api_v1_me_notifications_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreferences'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - MAXLaunchData: []
  /api/v1/me:
    get:
      tags:
      - resident
      summary: Me
      operationId: me_api_v1_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
      security:
      - MAXLaunchData: []
  /api/v1/houses/{house_id}/apartments:
    get:
      tags:
      - resident
      summary: Apartments
      operationId: apartments_api_v1_houses__house_id__apartments_get
      security:
      - MAXLaunchData: []
      parameters:
      - name: house_id
        in: path
        required: true
        schema:
          type: integer
          title: House Id
      - name: cursor
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Cursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApartmentPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/houses/{house_id}/issues:
    get:
      tags:
      - resident
      summary: Issues
      operationId: issues_api_v1_houses__house_id__issues_get
      security:
      - MAXLaunchData: []
      parameters:
      - name: house_id
        in: path
        required: true
        schema:
          type: integer
          title: House Id
      - name: cursor
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Cursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuePage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - resident
      summary: Report
      operationId: report_api_v1_houses__house_id__issues_post
      security:
      - MAXLaunchData: []
      parameters:
      - name: house_id
        in: path
        required: true
        schema:
          type: integer
          title: House Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIssue'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/issues/{issue_id}:
    get:
      tags:
      - resident
      summary: Detail
      operationId: detail_api_v1_issues__issue_id__get
      security:
      - MAXLaunchData: []
      parameters:
      - name: issue_id
        in: path
        required: true
        schema:
          type: integer
          title: Issue Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/issues/{issue_id}/messages:
    get:
      tags:
      - resident
      summary: Issue Messages
      description: Переписка автора обращения с УК. Другим жильцам недоступна.
      operationId: issue_messages_api_v1_issues__issue_id__messages_get
      security:
      - MAXLaunchData: []
      parameters:
      - name: issue_id
        in: path
        required: true
        schema:
          type: integer
          title: Issue Id
      - name: cursor
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Cursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueMessagePage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - resident
      summary: Issue Message
      description: Отправить сообщение в УК; повтор с тем же request_id не создаёт
        дубликат.
      operationId: issue_message_api_v1_issues__issue_id__messages_post
      security:
      - MAXLaunchData: []
      parameters:
      - name: issue_id
        in: path
        required: true
        schema:
          type: integer
          title: Issue Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueMessageInput'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueMessageOutput'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/issues/{issue_id}/presence:
    post:
      tags:
      - resident
      summary: Issue Presence
      description: Присутствие автора в чате и подтверждение прочитанных сообщений.
      operationId: issue_presence_api_v1_issues__issue_id__presence_post
      security:
      - MAXLaunchData: []
      parameters:
      - name: issue_id
        in: path
        required: true
        schema:
          type: integer
          title: Issue Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueChatPresenceInput'
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/houses/{house_id}/issues/with-photos:
    post:
      tags:
      - resident
      summary: Report With Photos
      operationId: report_with_photos_api_v1_houses__house_id__issues_with_photos_post
      security:
      - MAXLaunchData: []
      parameters:
      - name: house_id
        in: path
        required: true
        schema:
          type: integer
          title: House Id
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - data
              - photos
              properties:
                data:
                  type: string
                  description: JSON-encoded CreateIssue
                photos:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: string
                    format: binary
  /api/v1/issues/{issue_id}/photos/{photo_id}:
    get:
      tags:
      - resident
      summary: Resident Photo
      operationId: resident_photo_api_v1_issues__issue_id__photos__photo_id__get
      security:
      - MAXLaunchData: []
      parameters:
      - name: issue_id
        in: path
        required: true
        schema:
          type: integer
          title: Issue Id
      - name: photo_id
        in: path
        required: true
        schema:
          type: integer
          title: Photo Id
      responses:
        '200':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/apartments/{apartment_id}/messages:
    get:
      tags:
      - services
      summary: Messages
      operationId: messages_api_v1_apartments__apartment_id__messages_get
      security:
      - MAXLaunchData: []
      parameters:
      - name: apartment_id
        in: path
        required: true
        schema:
          type: integer
          title: Apartment Id
      - name: cursor
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Cursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - services
      summary: Send
      operationId: send_api_v1_apartments__apartment_id__messages_post
      security:
      - MAXLaunchData: []
      parameters:
      - name: apartment_id
        in: path
        required: true
        schema:
          type: integer
          title: Apartment Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessage'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/apartments/{apartment_id}/utilities:
    get:
      tags:
      - services
      summary: Account
      operationId: account_api_v1_apartments__apartment_id__utilities_get
      security:
      - MAXLaunchData: []
      parameters:
      - name: apartment_id
        in: path
        required: true
        schema:
          type: integer
          title: Apartment Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AccountResponse'
                - type: 'null'
                title: Response Account Api V1 Apartments  Apartment Id  Utilities
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/meters/{meter_id}/readings:
    post:
      tags:
      - services
      summary: Reading
      operationId: reading_api_v1_meters__meter_id__readings_post
      security:
      - MAXLaunchData: []
      parameters:
      - name: meter_id
        in: path
        required: true
        schema:
          type: integer
          title: Meter Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadingInput'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/houses/{house_id}/cameras:
    get:
      tags:
      - services
      summary: Cameras
      operationId: cameras_api_v1_houses__house_id__cameras_get
      security:
      - MAXLaunchData: []
      parameters:
      - name: house_id
        in: path
        required: true
        schema:
          type: integer
          title: House Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CameraResponse'
                title: Response Cameras Api V1 Houses  House Id  Cameras Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - services
      summary: Add Camera
      operationId: add_camera_api_v1_houses__house_id__cameras_post
      security:
      - MAXLaunchData: []
      parameters:
      - name: house_id
        in: path
        required: true
        schema:
          type: integer
          title: House Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCamera'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/cameras/{camera_id}/preview:
    get:
      tags:
      - services
      summary: Preview
      operationId: preview_api_v1_cameras__camera_id__preview_get
      security:
      - MAXLaunchData: []
      parameters:
      - name: camera_id
        in: path
        required: true
        schema:
          type: integer
          title: Camera Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraFrame'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/houses/{house_id}/works:
    get:
      tags:
      - services
      summary: Works
      operationId: works_api_v1_houses__house_id__works_get
      security:
      - MAXLaunchData: []
      parameters:
      - name: house_id
        in: path
        required: true
        schema:
          type: integer
          title: House Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkResponse'
                title: Response Works Api V1 Houses  House Id  Works Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/staff/cameras:
    get:
      tags:
      - Staff
      summary: Cameras For Moderation
      operationId: cameras_for_moderation_api_v1_staff_cameras_get
      security:
      - StaffSession: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          enum:
          - all
          - pending
          - approved
          - rejected
          type: string
          default: pending
          title: Status
      - name: page
        in: query
        required: false
        schema:
          type: integer
          maximum: 100000
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 5
          title: Page Size
      - name: house_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          title: House Id
      - name: entrance
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 100
            minimum: 1
          - type: 'null'
          title: Entrance
      - name: floor
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 200
            minimum: 1
          - type: 'null'
          title: Floor
      - name: zone
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 20
          - type: 'null'
          title: Zone
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffCameraPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/staff/cameras/{camera_id}/moderate:
    post:
      tags:
      - Staff
      summary: Review Camera
      operationId: review_camera_api_v1_staff_cameras__camera_id__moderate_post
      security:
      - StaffSession: []
      parameters:
      - name: camera_id
        in: path
        required: true
        schema:
          type: integer
          title: Camera Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerateCamera'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/staff/cameras/{camera_id}:
    delete:
      tags:
      - Staff
      summary: Remove Camera
      operationId: remove_camera_api_v1_staff_cameras__camera_id__delete
      security:
      - StaffSession: []
      parameters:
      - name: camera_id
        in: path
        required: true
        schema:
          type: integer
          title: Camera Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/staff/houses/{house_id}/contacts:
    get:
      tags:
      - Staff
      summary: Contacts
      operationId: contacts_api_v1_staff_houses__house_id__contacts_get
      security:
      - StaffSession: []
      parameters:
      - name: house_id
        in: path
        required: true
        schema:
          type: integer
          title: House Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactsOutput'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Staff
      summary: Update Contacts
      operationId: update_contacts_api_v1_staff_houses__house_id__contacts_post
      security:
      - StaffSession: []
      parameters:
      - name: house_id
        in: path
        required: true
        schema:
          type: integer
          title: House Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactsInput'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactsOutput'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/staff/auth/login:
    post:
      tags:
      - Staff
      summary: Login
      operationId: login_api_v1_staff_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/staff/auth/token:
    post:
      tags:
      - Staff
      summary: Access Token
      operationId: access_token_api_v1_staff_auth_token_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffTokenOutput'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/staff/auth/logout:
    post:
      tags:
      - Staff
      summary: Logout
      operationId: logout_api_v1_staff_auth_logout_post
      responses:
        '204':
          description: Successful Response
      security:
      - StaffSession: []
  /api/v1/staff/me:
    get:
      tags:
      - Staff
      summary: Profile
      operationId: profile_api_v1_staff_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
