components:
  schemas:
    AccountResponse:
      properties:
        number:
          type: string
          title: Number
        invoiceNumber:
          anyOf:
          - type: string
          - type: 'null'
          title: Invoicenumber
        area:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Area
        residents:
          type: integer
          title: Residents
        period:
          anyOf:
          - type: string
          - type: 'null'
          title: Period
        readingPeriod:
          type: string
          title: Readingperiod
        due:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Due
        charges:
          items:
            $ref: '#/components/schemas/Charge'
          type: array
          title: Charges
        meters:
          items:
            $ref: '#/components/schemas/MeterResponse'
          type: array
          title: Meters
      type: object
      required:
      - number
      - invoiceNumber
      - area
      - residents
      - period
      - readingPeriod
      - due
      - charges
      - meters
      title: AccountResponse
    ActionOutput:
      properties:
        notification_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Notification Id
        changed:
          type: boolean
          title: Changed
          default: true
      type: object
      required:
      - notification_id
      title: ActionOutput
    AnnouncementDeliveryOutput:
      properties:
        house_id:
          type: integer
          title: House Id
        address:
          type: string
          title: Address
        chat_title:
          type: string
          title: Chat Title
        status:
          type: string
          title: Status
        error:
          type: string
          title: Error
        sent_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Sent At
      type: object
      required:
      - house_id
      - address
      - chat_title
      - status
      - error
      - sent_at
      title: AnnouncementDeliveryOutput
    AnnouncementInput:
      properties:
        topic:
          type: string
          enum:
          - outage
          - works
          - meeting
          - other
          title: Topic
        title:
          type: string
          maxLength: 150
          minLength: 1
          title: Title
        text:
          type: string
          maxLength: 3000
          minLength: 1
          title: Text
        house_ids:
          items:
            type: integer
          type: array
          maxItems: 100
          minItems: 1
          title: House Ids
        version:
          type: integer
          minimum: 1.0
          title: Version
          default: 1
        channels:
          items:
            type: string
            enum:
            - groups
            - private
          type: array
          maxItems: 2
          minItems: 1
          title: Channels
        resident_ids:
          items:
            type: integer
          type: array
          maxItems: 100
          title: Resident Ids
        audience:
          type: string
          enum:
          - houses
          - residents
          title: Audience
          default: houses
      type: object
      required:
      - topic
      - title
      - text
      - house_ids
      title: AnnouncementInput
    AnnouncementOutput:
      properties:
        id:
          type: integer
          title: Id
        topic:
          type: string
          title: Topic
        title:
          type: string
          title: Title
        text:
          type: string
          title: Text
        status:
          type: string
          title: Status
        version:
          type: integer
          title: Version
        created_at:
          type: string
          format: date-time
          title: Created At
        sent_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Sent At
        deliveries:
          items:
            $ref: '#/components/schemas/AnnouncementDeliveryOutput'
          type: array
          title: Deliveries
        house_ids:
          items:
            type: integer
          type: array
          title: House Ids
        channels:
          items:
            type: string
          type: array
          title: Channels
        resident_ids:
          items:
            type: integer
          type: array
          title: Resident Ids
        private_deliveries:
          items:
            $ref: '#/components/schemas/PrivateAnnouncementDeliveryOutput'
          type: array
          title: Private Deliveries
        excluded_count:
          type: integer
          title: Excluded Count
        audience:
          type: string
          title: Audience
      type: object
      required:
      - id
      - topic
      - title
      - text
      - status
      - version
      - created_at
      - sent_at
      - deliveries
      - house_ids
      - channels
      - resident_ids
      - private_deliveries
      - excluded_count
      - audience
      title: AnnouncementOutput
    AnnouncementPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AnnouncementOutput'
