name: dompulse

x-api-build: &api-build
  context: .
  dockerfile: backend/Dockerfile

x-database: &database
  DATABASE_URL: postgresql+psycopg://dompulse:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}@db:5432/dompulse

services:
  db:
    image: postgres:17.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: dompulse
      POSTGRES_DB: dompulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    stop_grace_period: 30s

  migrate:
    build: *api-build
    environment: *database
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build: *api-build
    restart: unless-stopped
    init: true
    environment:
      <<: *database
      BOT_TOKEN: ${BOT_TOKEN:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      STAFF_SESSION_HOURS: ${STAFF_SESSION_HOURS:-8}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}
      LOCAL_LOGIN_ENABLED: "false"
      MEDIA_ROOT: /srv/data/media
    volumes:
      - media:/srv/data/media
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 10s

  frontend:
    build:
      context: ./mini-app
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_ENABLE_LOCAL_LOGIN: "false"
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  bot:
    build:
      context: .
      dockerfile: chatbot/Dockerfile
    restart: unless-stopped
    init: true
    profiles: [bot]
    environment:
      <<: *database
      BOT_TOKEN: ${BOT_TOKEN:-}
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      MINI_APP_BOT_USERNAME: ${MINI_APP_BOT_USERNAME:-t282_hakaton_max_bot}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
      MEDIA_ROOT: /srv/data/media
    volumes:
      - media:/srv/data/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s

volumes:
  postgres_data:
  media:
