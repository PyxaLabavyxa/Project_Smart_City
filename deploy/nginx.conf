server {
    listen 80;
    server_name 201.34.159.33;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://201.34.159.33$request_uri; }
}

server {
    listen 443 ssl;
    server_name 201.34.159.33;
    ssl_certificate /etc/letsencrypt/live/201.34.159.33/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/201.34.159.33/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 105m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location /staff {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
